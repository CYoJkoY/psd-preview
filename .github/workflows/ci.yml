name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Check formatting
        run: zig fmt --check build.zig src

      - name: Build
        run: zig build

      - name: Test
        run: zig build test --summary all
